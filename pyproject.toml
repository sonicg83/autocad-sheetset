[project]
name = "autocad-sheetset"
version = "0.2.1"
description = "本地 DST 图纸集管理器 MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "lxml>=6,<7",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
dst-manager = "dst_manager.interfaces.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dst_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
